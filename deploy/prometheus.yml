---
- name: Install Prometheus
  hosts: prometheus.local
  gather_facts: yes
  become: yes

  pre_tasks:
    - name: Display installation information
      debug:
        msg: |
          Prometheus Installation
          Target: {{ inventory_hostname }} ({{ ansible_host }})
          Time: {{ ansible_date_time.iso8601 }}

  roles:
    - install-prometheus

  post_tasks:
    - name: Display completion message
      debug:
        msg: |
          Prometheus installed on {{ inventory_hostname }}
          Direct URL: http://{{ inventory_hostname }}:9090
          Node Exporter: port 9100
          Next: run nginx-proxy.yml to configure reverse proxy
