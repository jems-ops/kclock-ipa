---
- name: Install Jenkins
  hosts: jenkins_servers
  gather_facts: yes
  become: yes

  pre_tasks:
    - name: Display installation information
      debug:
        msg: |
          Jenkins Installation
          Target: {{ inventory_hostname }} ({{ ansible_host }})
          Time: {{ ansible_date_time.iso8601 }}

  roles:
    - install-jenkins

  post_tasks:
    - name: Display completion message
      debug:
        msg: |
          Jenkins installed on {{ inventory_hostname }}
          Direct URL: http://{{ inventory_hostname }}:8080
          Next: run nginx-proxy.yml to configure reverse proxy
