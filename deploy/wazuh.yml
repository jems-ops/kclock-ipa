---
- name: Install Wazuh
  hosts: wazuh_servers
  gather_facts: yes
  become: yes

  pre_tasks:
    - name: Display installation information
      debug:
        msg: |
          Wazuh Installation
          Target: {{ inventory_hostname }} ({{ ansible_host }})
          Time: {{ ansible_date_time.iso8601 }}

  roles:
    - install-wazuh

  post_tasks:
    - name: Display completion message
      debug:
        msg: |
          Wazuh installed on {{ inventory_hostname }}
          Direct dashboard URL: https://{{ inventory_hostname }}:443
          Next: run nginx-proxy.yml to configure reverse proxy
