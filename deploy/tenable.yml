---
- name: Install Tenable Security Center
  hosts: securitycenter_servers
  gather_facts: yes
  become: yes

  pre_tasks:
    - name: Display installation information
      debug:
        msg: |
          Tenable Security Center Installation
          Target: {{ inventory_hostname }} ({{ ansible_host }})
          Time: {{ ansible_date_time.iso8601 }}

  roles:
    - tenable-security-center

  post_tasks:
    - name: Display completion message
      debug:
        msg: |
          Tenable Security Center installed on {{ inventory_hostname }}
          Direct URL: https://{{ inventory_hostname }}
          Next: run nginx-proxy.yml to configure reverse proxy
