---
- name: Validate realm exists
  ansible.builtin.command: >
    {{ keycloak_kcadm }} get realms/{{ keycloak_realm }}
  register: validate_realm
  changed_when: false

- name: Print Keycloak SAML IdP metadata URL
  ansible.builtin.debug:
    msg:
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "Keycloak SAML configuration complete."
      - ""
      - "IdP Metadata URL:"
      - "  {{ keycloak_saml_metadata_url }}"
      - ""
      - "SAML clients created: {{ keycloak_saml_clients | map(attribute='name') | join(', ') }}"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
