---
# ── Validate svc.ldap can bind and search ──────────────────────────────────
- name: Validate svc.ldap LDAP bind can search users
  ansible.builtin.shell: >
    LDAPTLS_REQCERT=never ldapsearch -x
    -H "{{ freeipa_ldap_url }}"
    -D "{{ freeipa_bind_dn }}"
    -w "{{ freeipa_bind_password }}"
    -b "{{ freeipa_users_dn }}"
    "(uid=admin)"
    dn
  register: ldap_bind_validation
  changed_when: false
  failed_when: ldap_bind_validation.rc != 0
  no_log: true

# ── Validate both service users are visible via LDAP ───────────────────────
- name: Validate service user is visible in LDAP
  ansible.builtin.shell: >
    LDAPTLS_REQCERT=never ldapsearch -x
    -H "{{ freeipa_ldap_url }}"
    -D "{{ freeipa_bind_dn }}"
    -w "{{ freeipa_bind_password }}"
    -b "{{ freeipa_users_dn }}"
    "(uid={{ item.uid }})"
    dn uid
  register: svc_ldap_visibility
  changed_when: false
  failed_when:
    - svc_ldap_visibility.rc != 0 or ('uid=' + item.uid) not in svc_ldap_visibility.stdout
  no_log: true
  loop:
    - uid: "{{ freeipa_bind_uid }}"
    - uid: "{{ freeipa_keycloak_svc_uid }}"
  loop_control:
    label: "{{ item.uid }}"

# ── Validate svc.keycloak can independently LDAP bind ──────────────────────
- name: Validate svc.keycloak LDAP bind
  ansible.builtin.shell: >
    LDAPTLS_REQCERT=never ldapsearch -x
    -H "{{ freeipa_ldap_url }}"
    -D "{{ freeipa_keycloak_svc_dn }}"
    -w "{{ freeipa_keycloak_svc_password }}"
    -b "{{ freeipa_users_dn }}"
    "(uid=admin)"
    dn
  register: keycloak_svc_bind_validation
  changed_when: false
  failed_when: keycloak_svc_bind_validation.rc != 0
  no_log: true

- name: Show LDAP validation results
  ansible.builtin.debug:
    msg:
      - "svc.ldap bind DN  : {{ freeipa_bind_dn }} — LDAP bind: SUCCESS"
      - "svc.keycloak bind DN: {{ freeipa_keycloak_svc_dn }} — LDAP bind: SUCCESS"
      - "Both service users visible in LDAP under {{ freeipa_users_dn }}"
