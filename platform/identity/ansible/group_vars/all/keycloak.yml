# ───────────────────────────────────────────────────────────────────────────
# Keycloak settings
# ───────────────────────────────────────────────────────────────────────────
keycloak_kcadm_url:   "http://localhost:8080"   # internal URL used by kcadm.sh on the Keycloak host
keycloak_admin_realm: master
keycloak_realm:       master
keycloak_admin_user:  admin

# Derived Keycloak realm / SAML endpoint URLs — used by every SAML SP role so
# there is one place to change if the realm name or base URL ever changes.
keycloak_realm_base_url:    "{{ keycloak_base_url }}/realms/{{ keycloak_realm }}"
keycloak_saml_metadata_url: "{{ keycloak_realm_base_url }}/protocol/saml/descriptor"
keycloak_saml_login_url:    "{{ keycloak_realm_base_url }}/protocol/saml"
keycloak_logout_url:        "{{ keycloak_realm_base_url }}/protocol/openid-connect/logout"
keycloak_admin_password: "{{ vault_keycloak_admin_password }}"
keycloak_home:        /opt/keycloak-22.0.5
keycloak_kcadm:       "{{ keycloak_home }}/bin/kcadm.sh"
keycloak_tmp_dir:     /tmp/keycloak-ansible

# LDAP federation
keycloak_ldap_provider_name: freeipa-ldap
keycloak_ldap_username_attr: uid
keycloak_ldap_rdn_attr:      uid
keycloak_ldap_uuid_attr:     ipaUniqueID
keycloak_ldap_user_object_classes:
  - person
  - organizationalPerson
  - inetOrgPerson
  - posixAccount
  - krbPrincipalAux

keycloak_ldap_bind_password: "{{ vault_freeipa_ldap_bind_password }}"
keycloak_ldap_use_truststore_spi: "ALWAYS"

# Truststore for LDAPS outbound connections.
# The JKS lives inside {{ keycloak_home }}/conf/truststores/ for a cleaner layout.
keycloak_truststore_dir:      "{{ keycloak_home }}/conf/truststores"
keycloak_truststore_path:     "{{ keycloak_truststore_dir }}/truststore.jks"
keycloak_truststore_password: "{{ vault_keycloak_truststore_password }}"

KEYCLOAK_ADMIN_PASSWORD: "{{ vault_keycloak_admin_password }}" # required for event fetching
KEYCLOAK_BASE_URL: "{{ keycloak_base_url }}"
OLLAMA_MODEL: "{{ vault_ollama_model_version }}"