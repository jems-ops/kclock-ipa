---
# Configures Keycloak SAML clients and protocol mappers for all onboarded apps.
#
# LDAP federation (FreeIPA → Keycloak) is managed separately.
# This playbook only handles the SAML SP side:
#   1. Ensures the target realm exists
#   2. Creates / updates SAML clients for each app
#   3. Adds NameID, user-property, group, and role-list mappers
#
# Prerequisite: Keycloak must be running with LDAP federation already configured.

- name: Configure Keycloak SAML clients and mappers
  hosts: keycloak
  become: true
  gather_facts: false
  roles:
    - keycloak_saml_federation
