---
- name: Fail if atlassian_product is not set
  ansible.builtin.assert:
    that:
      - atlassian_product in ['jira', 'confluence', 'bitbucket']
    fail_msg: >-
      atlassian_product must be one of: jira, confluence, bitbucket
      (got '{{ atlassian_product }}')

- name: Resolve product base URL
  ansible.builtin.set_fact:
    atlassian_base_url: "{{ lookup('vars', atlassian_product + '_base_url') }}"

- name: Resolve SAML API path for {{ atlassian_product }}
  ansible.builtin.set_fact:
    atlassian_saml_api_url: "{{ atlassian_base_url }}{{ atlassian_saml_api_paths[atlassian_product] }}"

- name: Confirm target
  ansible.builtin.debug:
    msg: "Configuring SAML SSO for {{ atlassian_product | capitalize }} at {{ atlassian_base_url }}"
