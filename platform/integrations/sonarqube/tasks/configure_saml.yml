---
# Write SAML configuration directly to sonar.properties — more reliable than the API
# for SonarQube 10.x, especially for signUpEnabled and cert settings.

- name: Backup sonar.properties before changes
  ansible.builtin.copy:
    src: "{{ sonarqube_home_path }}/conf/sonar.properties"
    dest: "{{ sonarqube_home_path }}/conf/sonar.properties.bak"
    remote_src: true
    mode: "0640"

- name: Set SonarQube base URL (ensures ACS URL is correct in SAMLRequests)
  ansible.builtin.lineinfile:
    path: "{{ sonarqube_home_path }}/conf/sonar.properties"
    regexp: '^sonar\.core\.serverBaseURL'
    line: "sonar.core.serverBaseURL={{ sonarqube_base_url }}"
    state: present

- name: Remove any existing SAML lines (clean re-apply)
  ansible.builtin.lineinfile:
    path: "{{ sonarqube_home_path }}/conf/sonar.properties"
    regexp: '^sonar\.auth\.saml\.'
    state: absent

- name: Write SAML configuration block to sonar.properties
  ansible.builtin.blockinfile:
    path: "{{ sonarqube_home_path }}/conf/sonar.properties"
    marker: "# {mark} ANSIBLE MANAGED - SAML"
    block: |
      sonar.auth.saml.enabled=true
      sonar.auth.saml.applicationId={{ sonarqube_saml_application_id }}
      sonar.auth.saml.providerName={{ sonarqube_saml_provider_name }}
      sonar.auth.saml.providerId={{ keycloak_realm_base_url }}
      sonar.auth.saml.loginUrl={{ keycloak_saml_login_url }}
      sonar.auth.saml.user.login={{ sonarqube_saml_user_login_attr }}
      sonar.auth.saml.user.name={{ sonarqube_saml_user_name_attr }}
      sonar.auth.saml.user.email={{ sonarqube_saml_user_email_attr }}
      sonar.auth.saml.group.name={{ sonarqube_saml_group_attr }}
      sonar.auth.saml.user.signUpEnabled={{ sonarqube_saml_allow_signup }}
    state: present
  notify: restart sonarqube

# Certificate must be on a single line — use lineinfile after the block
- name: Write Keycloak signing certificate to sonar.properties
  ansible.builtin.lineinfile:
    path: "{{ sonarqube_home_path }}/conf/sonar.properties"
    regexp: '^sonar\.auth\.saml\.certificate\.secured='
    line: "sonar.auth.saml.certificate.secured={{ keycloak_signing_cert }}"
    insertafter: "# END ANSIBLE MANAGED - SAML"
    state: present
  no_log: true
  notify: restart sonarqube
