---
# keycloak_saml_metadata_url / keycloak_realm_base_url / keycloak_saml_login_url
# are defined centrally in group_vars/all/main.yml — do not redeclare here.

sonarqube_admin_token:    "{{ vault_sonarqube_admin_token }}"
sonarqube_validate_certs: false

# SonarQube install path on the server.
# The role will auto-detect if left empty, or set explicitly e.g. /opt/sonarqube-10.3.0.82913
sonarqube_home: ""
