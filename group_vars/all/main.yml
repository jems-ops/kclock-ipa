---
# SSH credentials (resolved from vault)
ansible_user:            "{{ vault_ansible_user }}"
ansible_password:        "{{ vault_ansible_password }}"
ansible_become_password: "{{ vault_ansible_become_password }}"

# Hostname resolution from inventory groups
freeipa_hostname:   "{{ groups['freeipa'][0] }}"
keycloak_hostname:  "{{ groups['keycloak'][0] }}"
sonarqube_hostname: "{{ groups['sonarqube'][0] }}"
jenkins_hostname:   "{{ groups['jenkins'][0] }}"

# ───────────────────────────────────────────────────────────────────────────
# Base URLs (derived from hostnames). Override if you use different ports/schemes.
# Every role MUST reference these instead of hardcoding hostnames or URLs.
# ───────────────────────────────────────────────────────────────────────────
freeipa_base_url:   "https://{{ freeipa_hostname }}"
keycloak_base_url:  "https://{{ keycloak_hostname }}"
sonarqube_base_url: "https://{{ sonarqube_hostname }}"
jenkins_base_url:   "https://{{ jenkins_hostname }}"

# ───────────────────────────────────────────────────────────────────────────
# FreeIPA settings
# These default from the inventory hostname. Override only if your IPA domain
# differs from the host FQDN.
# ───────────────────────────────────────────────────────────────────────────
freeipa_domain:   "{{ freeipa_hostname }}"
freeipa_realm:    "{{ freeipa_domain | upper }}"
freeipa_base_dn:  "{{ freeipa_domain.split('.') | map('regex_replace', '^(.*)$', 'dc=\\1') | join(',') }}"

freeipa_users_dn:  "cn=users,cn=accounts,{{ freeipa_base_dn }}"
freeipa_groups_dn: "cn=groups,cn=accounts,{{ freeipa_base_dn }}"

# Bind user is a regular IPA user under cn=users,cn=accounts (not a sysaccount).
# Managed via the IPA CLI (kinit admin + ipa user-*) in freeipa_keycloak_prep.
freeipa_bind_uid:       svc_keycloak
freeipa_bind_dn:        "uid={{ freeipa_bind_uid }},cn=users,cn=accounts,{{ freeipa_base_dn }}"
freeipa_bind_password:  "{{ vault_freeipa_bind_password }}"

freeipa_admin_user:     admin
freeipa_admin_password: "{{ vault_freeipa_admin_password }}"

freeipa_ldap_scheme: "ldap"
freeipa_ldap_port:   389
freeipa_ldap_url:    "{{ freeipa_ldap_scheme }}://{{ freeipa_hostname }}:{{ freeipa_ldap_port }}"

# FreeIPA CA cert on the IPA server.
# Leave empty ("") to auto-detect across standard paths — see role defaults
# for the candidate list. Set explicitly only if your install uses a
# non-standard location.
freeipa_ca_cert_path:            ""
freeipa_keycloak_ca_export_path: /tmp/freeipa-ca.crt

# ───────────────────────────────────────────────────────────────────────────
# Keycloak settings
# ───────────────────────────────────────────────────────────────────────────
keycloak_kcadm_url:   "http://localhost:8080"   # internal URL used by kcadm.sh on the Keycloak host
keycloak_admin_realm: master
keycloak_realm:       master
keycloak_admin_user:  admin

# Derived Keycloak realm / SAML endpoint URLs — used by every SAML SP role so
# there is one place to change if the realm name or base URL ever changes.
keycloak_realm_base_url:    "{{ keycloak_base_url }}/realms/{{ keycloak_realm }}"
keycloak_saml_metadata_url: "{{ keycloak_realm_base_url }}/protocol/saml/descriptor"
keycloak_saml_login_url:    "{{ keycloak_realm_base_url }}/protocol/saml"
keycloak_logout_url:        "{{ keycloak_realm_base_url }}/protocol/openid-connect/logout"
keycloak_admin_password: "{{ vault_keycloak_admin_password }}"
keycloak_home:        /opt/keycloak-22.0.5
keycloak_kcadm:       "{{ keycloak_home }}/bin/kcadm.sh"
keycloak_tmp_dir:     /tmp/keycloak-ansible

# LDAP federation
keycloak_ldap_provider_name: freeipa-ldap
keycloak_ldap_username_attr: uid
keycloak_ldap_rdn_attr:      uid
keycloak_ldap_uuid_attr:     ipaUniqueID
keycloak_ldap_user_object_classes:
  - person
  - organizationalPerson
  - inetOrgPerson
  - posixAccount
  - krbPrincipalAux

keycloak_ldap_bind_password: "{{ vault_freeipa_bind_password }}"
keycloak_ldap_use_truststore_spi: "ALWAYS"

# Truststore for LDAPS outbound connections.
# The JKS lives inside {{ keycloak_home }}/conf/truststores/ for a cleaner layout.
keycloak_truststore_dir:      "{{ keycloak_home }}/conf/truststores"
keycloak_truststore_path:     "{{ keycloak_truststore_dir }}/truststore.jks"
keycloak_truststore_password: "{{ vault_keycloak_truststore_password }}"

# ───────────────────────────────────────────────────────────────────────────
# SAML clients
# Each app has its own ACS path (this is a property of the SAML SP, not of our
# hosting). Centralized below so there are no hardcoded hostnames or URLs.
# ───────────────────────────────────────────────────────────────────────────
sonarqube_saml_acs_path: "/oauth2/callback/saml"
jenkins_saml_acs_path:   "/securityRealm/finishLogin"

keycloak_saml_clients:
  - name:       sonarqube-saml
    client_id:  sonarqube
    acs_url:    "{{ sonarqube_base_url }}{{ sonarqube_saml_acs_path }}"
    admin_url:  "{{ sonarqube_base_url }}"
    base_url:   "{{ sonarqube_base_url }}"
    redirect_uris:
      - "{{ sonarqube_base_url }}/*"
    nameid_format:           email
    nameid_user_attribute:   email
    sign_documents:          "false"
    sign_assertions:         "true"
    force_post_binding:      "true"
    include_authnstatement:  "true"
    # Attribute mappers: user model property → SAML attribute name
    attributes:
      - { property: username, saml_name: username, friendly_name: username }
      - { property: email,    saml_name: email,    friendly_name: email    }

  - name:       jenkins-saml
    client_id:  jenkins
    acs_url:    "{{ jenkins_base_url }}{{ jenkins_saml_acs_path }}"
    admin_url:  "{{ jenkins_base_url }}"
    base_url:   "{{ jenkins_base_url }}"
    redirect_uris:
      - "{{ jenkins_base_url }}/*"
    nameid_format:           email
    nameid_user_attribute:   email
    sign_documents:          "false"
    sign_assertions:         "true"
    force_post_binding:      "true"
    include_authnstatement:  "true"
    # Attribute mappers: user model property → SAML attribute name
    # (Jenkins SAML plugin reads these by attribute name — same schema as SonarQube.)
    attributes:
      - { property: username, saml_name: username, friendly_name: username }
      - { property: email,    saml_name: email,    friendly_name: email    }

# ───────────────────────────────────────────────────────────────────────────
# SonarQube settings
# ───────────────────────────────────────────────────────────────────────────
sonarqube_admin_token:   "{{ vault_sonarqube_admin_token }}"

# These must match the SAML client / attribute names configured in Keycloak above
sonarqube_saml_provider_name:   "FreeIPA via Keycloak"
sonarqube_saml_application_id:  "sonarqube"
sonarqube_saml_user_login_attr:   "username"
sonarqube_saml_user_name_attr:    "username"
sonarqube_saml_user_email_attr:   "email"
sonarqube_saml_group_attr:        "groups"
sonarqube_saml_allow_signup:      "true"
