---
- name: Display Wazuh SAML integration summary
  ansible.builtin.debug:
    msg: >-
      Configuring Wazuh SAML with IdP entity
      {{ keycloak_realm_base_url }}, SP entity {{ wazuh_saml_sp_entity_id }},
      dashboard at {{ wazuh_base_url }}.

# ── IdP metadata ──────────────────────────────────────────────────────────
- name: Ensure Wazuh indexer security directory exists
  ansible.builtin.file:
    path: "{{ wazuh_indexer_security_dir }}"
    state: directory
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: '0750'

- name: Check if idp-metadata.xml already exists
  ansible.builtin.stat:
    path: "{{ wazuh_idp_metadata_path }}"
  register: wazuh_idp_metadata

- name: Write idp-metadata.xml from Keycloak SAML descriptor
  ansible.builtin.copy:
    dest: "{{ wazuh_idp_metadata_path }}"
    content: "{{ keycloak_saml_metadata.content }}"
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: '0644'
  when:
    - keycloak_saml_metadata is defined
    - keycloak_saml_metadata.content is defined
    - not (wazuh_idp_metadata.stat.exists | default(false))
  notify:
    - Restart wazuh-indexer
    - Restart wazuh-dashboard

# ── Indexer config.yml – SAML authc block ─────────────────────────────────
- name: Check Wazuh indexer config.yml exists
  ansible.builtin.stat:
    path: "{{ wazuh_indexer_security_config }}"
  register: wazuh_indexer_config_stat

- name: Backup Wazuh indexer config.yml before SAML changes
  ansible.builtin.copy:
    src: "{{ wazuh_indexer_security_config }}"
    dest: "{{ wazuh_indexer_security_config }}.bak"
    remote_src: true
    mode: '0640'
  when: wazuh_indexer_config_stat.stat.exists | default(false)

- name: Inject SAML authc block into indexer config.yml (idempotent)
  ansible.builtin.blockinfile:
    path: "{{ wazuh_indexer_security_config }}"
    marker: "# {mark} ANSIBLE WAZUH SAML"
    insertafter: "^authc:"
    block: |
      saml_auth_domain:
        http_enabled: true
        transport_enabled: false
        order: {{ wazuh_saml_authc_order }}
        http_authenticator:
          type: saml
          challenge: true
          config:
            idp:
              metadata_file: '{{ wazuh_idp_metadata_path }}'
              entity_id: '{{ keycloak_realm_base_url }}'
            sp:
              entity_id: '{{ wazuh_saml_sp_entity_id }}'
            kibana_url: '{{ wazuh_base_url }}'
            subject_key: '{{ wazuh_saml_subject_key }}'
            roles_key: '{{ wazuh_saml_roles_key }}'
            exchange_key: '{{ wazuh_saml_exchange_key }}'
        authentication_backend:
          type: noop
  when: wazuh_indexer_config_stat.stat.exists | default(false)
  notify:
    - Restart wazuh-indexer

# ── Indexer roles_mapping.yml ─────────────────────────────────────────────
- name: Check Wazuh indexer roles_mapping.yml exists
  ansible.builtin.stat:
    path: "{{ wazuh_indexer_roles_mapping }}"
  register: wazuh_roles_mapping_stat

- name: Backup Wazuh indexer roles_mapping.yml before SAML changes
  ansible.builtin.copy:
    src: "{{ wazuh_indexer_roles_mapping }}"
    dest: "{{ wazuh_indexer_roles_mapping }}.bak"
    remote_src: true
    mode: '0640'
  when: wazuh_roles_mapping_stat.stat.exists | default(false)

- name: Ensure all_access backend role mapping for admin exists
  ansible.builtin.blockinfile:
    path: "{{ wazuh_indexer_roles_mapping }}"
    marker: "# {mark} ANSIBLE WAZUH SAML"
    block: |
      all_access:
        reserved: false
        hidden: false
        backend_roles:
          - "admin"
  when: wazuh_roles_mapping_stat.stat.exists | default(false)
  notify:
    - Restart wazuh-indexer

# ── Dashboard opensearch_dashboards.yml ───────────────────────────────────
- name: Check Wazuh dashboard config file exists
  ansible.builtin.stat:
    path: "{{ wazuh_dashboard_config }}"
  register: wazuh_dashboard_config_stat

- name: Backup Wazuh dashboard opensearch_dashboards.yml before SAML changes
  ansible.builtin.copy:
    src: "{{ wazuh_dashboard_config }}"
    dest: "{{ wazuh_dashboard_config }}.bak"
    remote_src: true
    mode: '0640'
  when: wazuh_dashboard_config_stat.stat.exists | default(false)

- name: Check if SAML auth already configured in opensearch_dashboards.yml
  ansible.builtin.shell: >-
    grep -q 'opensearch_security.auth.type' {{ wazuh_dashboard_config }}
    && echo present || echo absent
  register: wazuh_dashboard_saml_check
  changed_when: false
  when: wazuh_dashboard_config_stat.stat.exists | default(false)

- name: Enable SAML auth type in opensearch_dashboards.yml
  ansible.builtin.blockinfile:
    path: "{{ wazuh_dashboard_config }}"
    marker: "# {mark} ANSIBLE WAZUH SAML"
    block: |
      opensearch_security.auth.type: "saml"
      server.xsrf.allowlist: ["/_opendistro/_security/saml/acs", "/_opendistro/_security/saml/logout", "/_opendistro/_security/saml/acs/idpinitiated"]
      opensearch_security.session.keepalive: false
  when:
    - wazuh_dashboard_config_stat.stat.exists | default(false)
    - (wazuh_dashboard_saml_check.stdout | default('absent')) != 'present'
  notify:
    - Restart wazuh-dashboard

# ── Wazuh API wazuh.yml – disable run_as ──────────────────────────────────
- name: Check Wazuh API config file exists
  ansible.builtin.stat:
    path: "{{ wazuh_api_config_path }}"
  register: wazuh_api_config_stat

- name: Backup Wazuh API config wazuh.yml before SAML changes
  ansible.builtin.copy:
    src: "{{ wazuh_api_config_path }}"
    dest: "{{ wazuh_api_config_path }}.bak"
    remote_src: true
    mode: '0640'
  when: wazuh_api_config_stat.stat.exists | default(false)

- name: Ensure run_as is false in Wazuh API config
  ansible.builtin.lineinfile:
    path: "{{ wazuh_api_config_path }}"
    regexp: '^\s*run_as:'
    line: 'run_as: false'
    backrefs: false
  when: wazuh_api_config_stat.stat.exists | default(false)
  notify:
    - Restart wazuh-dashboard

# ── Final summary ─────────────────────────────────────────────────────────
- name: Final Wazuh SAML reminder
  ansible.builtin.debug:
    msg:
      - "Keycloak side for app=wazuh is now configured by the generic role."
      - "Basic Wazuh indexer/dashboard SAML wiring has been applied (config.yml, roles_mapping.yml, opensearch_dashboards.yml, wazuh.yml)."
      - "Review docs/WAZUH_KEYCLOAK_SAML_MANUAL_SETUP.md for fine-tuning (exchange_key, realms, advanced options)."
