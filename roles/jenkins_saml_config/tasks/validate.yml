---
- name: Verify SAML realm is present in config.xml
  ansible.builtin.command: >
    grep -c 'org.jenkinsci.plugins.saml.SamlSecurityRealm'
    {{ jenkins_home_path }}/config.xml
  register: jenkins_saml_verify
  changed_when: false
  failed_when: jenkins_saml_verify.rc != 0

- name: Display completion message
  ansible.builtin.debug:
    msg:
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "Jenkins SAML security realm written to {{ jenkins_home_path }}/config.xml"
      - ""
      - "To test SSO:"
      - "  1. Wait for Jenkins to restart"
      - "  2. Open {{ jenkins_base_url }} in a browser"
      - "  3. Click 'Login with SAML SSO'"
      - "  4. Authenticate with a FreeIPA user via Keycloak"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
