---
# Configure Artifactory SAML Authentication via REST API
#
# Flow mirrors the proven reference implementation:
#   1. Stop Artifactory service
#   2. Check / enable SSO general settings
#   3. Check if SAML provider exists  →  POST (create) or PUT (update)
#   4. Start Artifactory service and wait for it to become healthy

# ───────────────────────────────────────────────────────────────────────────
# 1. Stop Artifactory
# ───────────────────────────────────────────────────────────────────────────

- name: Stop Artifactory service
  ansible.builtin.systemd:
    name: "{{ artifactory_service_name }}"
    state: stopped
  become: true

- name: Wait for Artifactory to stop
  ansible.builtin.wait_for:
    port: "{{ artifactory_port }}"
    host: 127.0.0.1
    state: stopped
    timeout: 60

# ───────────────────────────────────────────────────────────────────────────
# 2. SSO general settings
# ───────────────────────────────────────────────────────────────────────────

- name: Check SSO general settings status
  ansible.builtin.uri:
    url: "{{ artifactory_saml_general_settings_endpoint }}"
    method: GET
    headers:
      Authorization: "Bearer {{ artifactory_api_token }}"
    status_code: [200]
    validate_certs: "{{ artifactory_validate_certs }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  register: sso_general_settings_result
  failed_when: false

- name: Enable SSO general settings
  ansible.builtin.uri:
    url: "{{ artifactory_saml_general_settings_endpoint }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ artifactory_api_token }}"
      Content-Type: application/json
    body_format: json
    body:
      enable: true
    status_code: [200, 201, 204]
    validate_certs: "{{ artifactory_validate_certs }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  register: sso_enable_result
  when: sso_general_settings_result.json.enable is defined and not sso_general_settings_result.json.enable

# ───────────────────────────────────────────────────────────────────────────
# 3. Create or update SAML provider
# ───────────────────────────────────────────────────────────────────────────

- name: Check if SAML configuration exists
  ansible.builtin.uri:
    url: "{{ artifactory_saml_setting_endpoint }}"
    method: GET
    headers:
      Authorization: "Bearer {{ artifactory_api_token }}"
    status_code: [200, 404]
    validate_certs: "{{ artifactory_validate_certs }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  register: saml_check_result
  failed_when: false

- name: Create SAML configuration (POST)
  ansible.builtin.uri:
    url: "{{ artifactory_saml_collection_endpoint }}"
    method: POST
    headers:
      Authorization: "Bearer {{ artifactory_api_token }}"
      Content-Type: application/json
    body_format: json
    body: "{{ lookup('template', 'artifactory-saml-setting.json.j2') | from_json }}"
    status_code: [200, 201]
    validate_certs: "{{ artifactory_validate_certs }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  when: saml_check_result.status == 404
  register: saml_create_result

- name: Update SAML configuration (PUT)
  ansible.builtin.uri:
    url: "{{ artifactory_saml_setting_endpoint }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ artifactory_api_token }}"
      Content-Type: application/json
    body_format: json
    body: "{{ lookup('template', 'artifactory-saml-setting.json.j2') | from_json }}"
    status_code: [200, 201]
    validate_certs: "{{ artifactory_validate_certs }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  when: saml_check_result.status == 200
  register: saml_update_result

# ───────────────────────────────────────────────────────────────────────────
# 4. Start Artifactory
# ───────────────────────────────────────────────────────────────────────────

- name: Start Artifactory service
  ansible.builtin.systemd:
    name: "{{ artifactory_service_name }}"
    state: started
    enabled: true
  become: true

- name: Wait for Artifactory to start
  ansible.builtin.wait_for:
    port: "{{ artifactory_port }}"
    host: 127.0.0.1
    state: started
    timeout: 300
