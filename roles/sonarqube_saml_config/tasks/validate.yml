---
- name: Verify SAML settings are present in sonar.properties
  ansible.builtin.command: >
    grep -c 'sonar.auth.saml.enabled=true'
    {{ sonarqube_home_path }}/conf/sonar.properties
  register: saml_verify
  changed_when: false
  failed_when: saml_verify.rc != 0

- name: Display completion message
  ansible.builtin.debug:
    msg:
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "SonarQube SAML settings written to sonar.properties."
      - ""
      - "To test SSO:"
      - "  1. Open {{ sonarqube_base_url }} in a browser"
      - "  2. Click 'Log in with {{ sonarqube_saml_provider_name }}'"
      - "  3. Authenticate with a FreeIPA user via Keycloak"
      - "  4. Verify you are logged in to SonarQube"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
