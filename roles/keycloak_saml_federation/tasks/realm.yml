---
# We use the built-in 'master' realm (shared across all SAML SPs). It always
# exists on a running Keycloak, so we only need to verify that and report status.
# Do NOT delete any realm here — deletion is a destructive one-off and should
# be performed manually if ever needed.

- name: Check that realm exists
  ansible.builtin.command: >
    {{ keycloak_kcadm }} get realms/{{ keycloak_realm }}
  register: realm_check
  changed_when: false
  failed_when: false

- name: Create realm if missing
  ansible.builtin.command: >
    {{ keycloak_kcadm }} create realms
    -s realm={{ keycloak_realm }}
    -s enabled=true
    -s displayName="{{ keycloak_realm | capitalize }} Realm"
    -s registrationAllowed=false
    -s loginWithEmailAllowed=true
  when: realm_check.rc != 0
  register: realm_create
  changed_when: realm_create.rc == 0

- name: Parse realm status JSON
  ansible.builtin.set_fact:
    keycloak_realm_info: "{{ realm_check.stdout | from_json }}"
  when: realm_check.rc == 0

- name: Realm status
  ansible.builtin.debug:
    msg: >-
      Realm '{{ keycloak_realm }}':
      {% if realm_check.rc == 0 %}exists (enabled={{ keycloak_realm_info.enabled }}){% else %}created{% endif %}
