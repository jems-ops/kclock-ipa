---
# Pattern: render payload → attempt create → rc==0 means created, non-zero means already exists (409)
# failed_when: false prevents failure on duplicates; changed_when: rc==0 ensures idempotent reporting.

- name: Render username LDAP mapper
  ansible.builtin.template:
    src: user-attribute-mapper.json.j2
    dest: "{{ keycloak_tmp_dir }}/mapper-username.json"
    mode: "0644"
  vars:
    mapper_name:      username
    ldap_attr:        uid
    user_model_attr:  username

- name: Create username LDAP mapper
  ansible.builtin.command: >
    {{ keycloak_kcadm }} create components -r {{ keycloak_realm }}
    -f {{ keycloak_tmp_dir }}/mapper-username.json
  register: mapper_username
  failed_when: false
  changed_when: mapper_username.rc == 0

