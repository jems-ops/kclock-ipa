---
# Resolve the internal UUID for each SAML client (needed to attach protocol mappers)
- name: Gather internal client UUIDs
  ansible.builtin.shell: >
    {{ keycloak_kcadm }} get clients -r {{ keycloak_realm }}
    -q clientId={{ item.client_id }}
    | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[0]["id"] if d else "")'
  register: saml_client_uuid_results
  changed_when: false
  loop: "{{ keycloak_saml_clients }}"
  loop_control:
    label: "{{ item.name }}"

- name: Build client name → UUID map
  ansible.builtin.set_fact:
    saml_client_ids: "{{ saml_client_ids | default({}) | combine({item.item.name: item.stdout | trim}) }}"
  loop: "{{ saml_client_uuid_results.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# ─── NameID mappers ──────────────────────────────────────────────────────────
- name: Render NameID mapper payloads
  ansible.builtin.template:
    src: saml-nameid-mapper.json.j2
    dest: "{{ keycloak_tmp_dir }}/nameid-{{ item.name }}.json"
    mode: "0644"
  loop: "{{ keycloak_saml_clients }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check if NameID mapper already exists
  ansible.builtin.shell: |
    {{ keycloak_kcadm }} get clients/{{ saml_client_ids[item.name] }}/protocol-mappers/models -r {{ keycloak_realm }} | python3 -c 'import sys,json; d=json.load(sys.stdin); match=[m["id"] for m in d if m.get("name")=="nameid"]; print(match[0] if match else "")'
  register: nameid_mapper_existing
  changed_when: false
  loop: "{{ keycloak_saml_clients }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create NameID mapper (if missing)
  ansible.builtin.command: >
    {{ keycloak_kcadm }} create
    clients/{{ saml_client_ids[item.item.name] }}/protocol-mappers/models
    -r {{ keycloak_realm }}
    -f {{ keycloak_tmp_dir }}/nameid-{{ item.item.name }}.json
  when: item.stdout | trim == ''
  loop: "{{ nameid_mapper_existing.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: nameid_create_result
  failed_when: nameid_create_result.rc is defined and nameid_create_result.rc != 0
  changed_when: nameid_create_result.rc is defined and nameid_create_result.rc == 0

- name: Update NameID mapper (if exists)
  ansible.builtin.command: >
    {{ keycloak_kcadm }} update
    clients/{{ saml_client_ids[item.item.name] }}/protocol-mappers/models/{{ item.stdout | trim }}
    -r {{ keycloak_realm }}
    -f {{ keycloak_tmp_dir }}/nameid-{{ item.item.name }}.json
  when: item.stdout | trim != ''
  loop: "{{ nameid_mapper_existing.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: nameid_update_result
  failed_when: nameid_update_result.rc is defined and nameid_update_result.rc != 0
  changed_when: nameid_update_result.rc is defined and nameid_update_result.rc == 0

# ─── User property mappers ───────────────────────────────────────────────────
- name: Render user property mapper payloads
  ansible.builtin.template:
    src: saml-user-property-mapper.json.j2
    dest: "{{ keycloak_tmp_dir }}/{{ item.0.name }}-{{ item.1.saml_name }}.json"
    mode: "0644"
  loop: "{{ keycloak_saml_clients | subelements('attributes') }}"
  loop_control:
    label: "{{ item.0.name }} -> {{ item.1.saml_name }}"

- name: Check if user property mapper already exists
  ansible.builtin.shell: |
    {{ keycloak_kcadm }} get clients/{{ saml_client_ids[item.0.name] }}/protocol-mappers/models -r {{ keycloak_realm }} | python3 -c 'import sys,json; d=json.load(sys.stdin); match=[m["id"] for m in d if m.get("name")=="{{ item.1.saml_name }}"]; print(match[0] if match else "")'
  register: user_prop_mapper_existing
  changed_when: false
  loop: "{{ keycloak_saml_clients | subelements('attributes') }}"
  loop_control:
    label: "{{ item.0.name }} -> {{ item.1.saml_name }}"

- name: Create user property mapper (if missing)
  ansible.builtin.command: >
    {{ keycloak_kcadm }} create
    clients/{{ saml_client_ids[item.item.0.name] }}/protocol-mappers/models
    -r {{ keycloak_realm }}
    -f {{ keycloak_tmp_dir }}/{{ item.item.0.name }}-{{ item.item.1.saml_name }}.json
  when: item.stdout | trim == ''
  loop: "{{ user_prop_mapper_existing.results }}"
  loop_control:
    label: "{{ item.item.0.name }} -> {{ item.item.1.saml_name }}"
  register: user_prop_create_result
  failed_when: user_prop_create_result.rc is defined and user_prop_create_result.rc != 0
  changed_when: user_prop_create_result.rc is defined and user_prop_create_result.rc == 0

- name: Update user property mapper (if exists)
  ansible.builtin.command: >
    {{ keycloak_kcadm }} update
    clients/{{ saml_client_ids[item.item.0.name] }}/protocol-mappers/models/{{ item.stdout | trim }}
    -r {{ keycloak_realm }}
    -f {{ keycloak_tmp_dir }}/{{ item.item.0.name }}-{{ item.item.1.saml_name }}.json
  when: item.stdout | trim != ''
  loop: "{{ user_prop_mapper_existing.results }}"
  loop_control:
    label: "{{ item.item.0.name }} -> {{ item.item.1.saml_name }}"
  register: user_prop_update_result
  failed_when: user_prop_update_result.rc is defined and user_prop_update_result.rc != 0
  changed_when: user_prop_update_result.rc is defined and user_prop_update_result.rc == 0

