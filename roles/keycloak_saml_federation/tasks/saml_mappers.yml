---
# ------------------------------------------
# 1. Resolve every SAML client's internal UUID
# ------------------------------------------
- name: Look up SAML client UUIDs
  ansible.builtin.command: >
    {{ keycloak_kcadm }} get clients
    -r {{ keycloak_realm }}
    -q clientId={{ item.client_id }}
  register: saml_client_lookup
  changed_when: false
  loop: "{{ keycloak_saml_clients }}"
  loop_control:
    label: "{{ item.name }}"

# ------------------------------------------
# 2. Build a client name -> UUID map
# ------------------------------------------

- name: Build client name to UUID map
  ansible.builtin.set_fact:
    saml_client_ids: >-
      {{
        saml_client_ids | default({}) |
        combine({ item.item.name: ((item.stdout | from_json | first).id) })
      }}
  when: (item.stdout | from_json | length) > 0
  loop: "{{ saml_client_lookup.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# ------------------------------------------
# 3. Fail fast if any expected client is missing
# ------------------------------------------

- name: Fail if any SAML client UUID is missing
  ansible.builtin.assert:
    that:
      - saml_client_ids[item.name] is defined
    fail_msg: "SAML client {{ item.name }} was not found."
  loop: "{{ keycloak_saml_clients }}"
  loop_control:
    label: "{{ item.name }}"

# ------------------------------------------
# 4. NameID mapper
# ------------------------------------------

- name: Render NameID mapper payloads
  ansible.builtin.template:
    src: saml-nameid-mapper.json.j2
    dest: "{{ keycloak_tmp_dir }}/nameid-{{ item.name }}.json"
    mode: "0600"
  loop: "{{ keycloak_saml_clients }}"
  loop_control:
    label: "{{ item.name }}"

# Create is intentional here — "already exists" is treated as a compliant
# no-op, so this task is safe on repeated runs.

- name: Apply NameID mapper
  ansible.builtin.command: >
    {{ keycloak_kcadm }} create
    clients/{{ saml_client_ids[item.name] }}/protocol-mappers/models
    -r {{ keycloak_realm }}
    -f {{ keycloak_tmp_dir }}/nameid-{{ item.name }}.json
  register: nameid_mapper_result
  # Treat "mapper already present" as a compliant no-op. Keycloak has used a
  # couple of different phrasings for this across versions, so match on the
  # common substring 'exists' which covers both "already exists" and
  # "Protocol mapper exists with same name".
  failed_when:
    - nameid_mapper_result.rc != 0
    - "'exists' not in nameid_mapper_result.stderr"
  changed_when:
    - nameid_mapper_result.rc == 0
    - "'exists' not in nameid_mapper_result.stderr"
  loop: "{{ keycloak_saml_clients }}"
  loop_control:
    label: "{{ item.name }}"

# ------------------------------------------
# 5. User property mappers (username/email/etc.)
# ------------------------------------------

- name: Render user property mapper payloads
  ansible.builtin.template:
    src: saml-user-property-mapper.json.j2
    dest: "{{ keycloak_tmp_dir }}/{{ item.0.name }}-{{ item.1.saml_name }}.json"
    mode: "0600"
  loop: "{{ keycloak_saml_clients | subelements('attributes') }}"
  loop_control:
    label: "{{ item.0.name }} -> {{ item.1.saml_name }}"

# Same create-with-no-op pattern as the NameID mapper.

- name: Apply user property mapper
  ansible.builtin.command: >
    {{ keycloak_kcadm }} create
    clients/{{ saml_client_ids[item.0.name] }}/protocol-mappers/models
    -r {{ keycloak_realm }}
    -f {{ keycloak_tmp_dir }}/{{ item.0.name }}-{{ item.1.saml_name }}.json
  register: user_mapper_result
  failed_when:
    - user_mapper_result.rc != 0
    - "'exists' not in user_mapper_result.stderr"
  changed_when:
    - user_mapper_result.rc == 0
    - "'exists' not in user_mapper_result.stderr"
  loop: "{{ keycloak_saml_clients | subelements('attributes') }}"
  loop_control:
    label: "{{ item.0.name }} -> {{ item.1.saml_name }}"

# ------------------------------------------
# 6. Group membership mapper
# ------------------------------------------

- name: Render group mapper payloads
  ansible.builtin.template:
    src: saml-group-mapper.json.j2
    dest: "{{ keycloak_tmp_dir }}/groups-{{ item.name }}.json"
    mode: "0600"
  loop: "{{ keycloak_saml_clients }}"
  loop_control:
    label: "{{ item.name }}"

- name: Apply group mapper
  ansible.builtin.command: >
    {{ keycloak_kcadm }} create
    clients/{{ saml_client_ids[item.name] }}/protocol-mappers/models
    -r {{ keycloak_realm }}
    -f {{ keycloak_tmp_dir }}/groups-{{ item.name }}.json
  register: group_mapper_result
  failed_when:
    - group_mapper_result.rc != 0
    - "'exists' not in group_mapper_result.stderr"
  changed_when:
    - group_mapper_result.rc == 0
    - "'exists' not in group_mapper_result.stderr"
  loop: "{{ keycloak_saml_clients }}"
  loop_control:
    label: "{{ item.name }}"
