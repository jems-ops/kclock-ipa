---
- name: Trigger full user sync from FreeIPA LDAP
  ansible.builtin.command: >
    {{ keycloak_kcadm }} create
    user-storage/{{ keycloak_ldap_provider_id }}/sync?action=triggerFullSync
    -r {{ keycloak_realm }}
  register: full_sync_result
  changed_when: true
  failed_when: false

- name: Show sync result
  ansible.builtin.debug:
    msg: "Sync result: {{ full_sync_result.stdout | default(full_sync_result.stderr) | default('no output') }}"
