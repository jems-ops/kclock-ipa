---
# ------------------------------------------
# 1. Look up each client by clientId
# ------------------------------------------
- name: Look up existing SAML clients
  ansible.builtin.command: >
    {{ keycloak_kcadm }} get clients
    -r {{ keycloak_realm }}
    -q clientId={{ item.client_id }}
  register: saml_client_lookup
  changed_when: false
  loop: "{{ keycloak_saml_clients }}"
  loop_control:
    label: "{{ item.name }}"

# ------------------------------------------
# 2. Validate lookup output before parsing
# ------------------------------------------

- name: Validate SAML client lookup output
  ansible.builtin.assert:
    that:
      - item.stdout is defined
      - item.stdout | from_json is iterable
    fail_msg: "Invalid Keycloak client lookup response for {{ item.item.name }}"
  loop: "{{ saml_client_lookup.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# ------------------------------------------
# 3. Render payloads for every client
#    (same payload used for create/update)
# ------------------------------------------

- name: Render SAML client JSON payloads
  ansible.builtin.template:
    src: saml-client.json.j2
    dest: "{{ keycloak_tmp_dir }}/client-{{ item.item.name }}.json"
    mode: "0600"
  loop: "{{ saml_client_lookup.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# ------------------------------------------
# 4. Create clients that do not yet exist
# ------------------------------------------

- name: Create missing SAML clients
  ansible.builtin.command: >
    {{ keycloak_kcadm }} create clients
    -r {{ keycloak_realm }}
    -f {{ keycloak_tmp_dir }}/client-{{ item.item.name }}.json
  when: (item.stdout | from_json | length) == 0
  register: saml_client_create
  changed_when: saml_client_create.rc == 0
  loop: "{{ saml_client_lookup.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# ------------------------------------------
# 5. Update clients that already exist
# ------------------------------------------

- name: Update existing SAML clients
  ansible.builtin.command: >
    {{ keycloak_kcadm }} update clients/{{ ((item.stdout | from_json | first).id) }}
    -r {{ keycloak_realm }}
    -f {{ keycloak_tmp_dir }}/client-{{ item.item.name }}.json
  when: (item.stdout | from_json | length) > 0
  register: saml_client_update
  changed_when: saml_client_update.rc == 0
  loop: "{{ saml_client_lookup.results }}"
  loop_control:
    label: "{{ item.item.name }}"
