---
- name: List existing components in realm
  ansible.builtin.command: >
    {{ keycloak_kcadm }} get components -r {{ keycloak_realm }}
  register: realm_components_raw
  changed_when: false

- name: Check if LDAP provider already exists
  ansible.builtin.set_fact:
    keycloak_ldap_provider_present: "{{ keycloak_ldap_provider_name in realm_components_raw.stdout }}"

# Keycloak requires the realm UUID (not name) as parentId for sync to work
- name: Get realm UUID
  ansible.builtin.shell: >
    {{ keycloak_kcadm }} get realms/{{ keycloak_realm }}
    | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])'
  register: keycloak_realm_uuid_cmd
  changed_when: false

- name: Set realm UUID fact
  ansible.builtin.set_fact:
    keycloak_realm_uuid: "{{ keycloak_realm_uuid_cmd.stdout | trim }}"

- name: Render LDAP provider JSON payload
  ansible.builtin.template:
    src: ldap-provider.json.j2
    dest: "{{ keycloak_tmp_dir }}/ldap-provider.json"
    mode: "0644"

- name: Create LDAP provider component
  ansible.builtin.command: >
    {{ keycloak_kcadm }} create components -r {{ keycloak_realm }}
    -f {{ keycloak_tmp_dir }}/ldap-provider.json
  when: not keycloak_ldap_provider_present
  register: ldap_provider_create
  changed_when: ldap_provider_create.rc == 0

- name: Retrieve LDAP provider internal ID
  ansible.builtin.shell: >
    {{ keycloak_kcadm }} get components -r {{ keycloak_realm }}
    | python3 -c 'import sys,json;
    data=json.load(sys.stdin);
    m=[x for x in data if x.get("name")=="{{ keycloak_ldap_provider_name }}"];
    print(m[0]["id"] if m else "")'
  register: ldap_provider_id_cmd
  changed_when: false

- name: Set LDAP provider ID fact
  ansible.builtin.set_fact:
    keycloak_ldap_provider_id: "{{ ldap_provider_id_cmd.stdout | trim }}"

- name: Fail if LDAP provider ID could not be resolved
  ansible.builtin.fail:
    msg: "Could not retrieve ID for LDAP provider '{{ keycloak_ldap_provider_name }}' in realm '{{ keycloak_realm }}'"
  when: keycloak_ldap_provider_id | length == 0

- name: Update existing LDAP provider config on rerun
  ansible.builtin.command: >
    {{ keycloak_kcadm }} update components/{{ keycloak_ldap_provider_id }} -r {{ keycloak_realm }}
    -f {{ keycloak_tmp_dir }}/ldap-provider.json
  when: keycloak_ldap_provider_present
  register: ldap_provider_update
  changed_when: ldap_provider_update.rc == 0

- name: LDAP provider status
  ansible.builtin.debug:
    msg: "LDAP provider '{{ keycloak_ldap_provider_name }}' ID: {{ keycloak_ldap_provider_id }}"
