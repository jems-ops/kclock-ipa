---
# Manage the Keycloak bind user via the supported IPA CLI instead of raw LDAP.
# On established IPA servers the user already exists -> everything skips.
# On a fresh server the user is created under cn=users,cn=accounts and its
# password is primed so LDAP simple bind works without a forced first-login
# password change.

- name: Obtain admin Kerberos ticket
  ansible.builtin.shell: |
    set -o pipefail
    echo "{{ freeipa_admin_password }}" | kinit {{ freeipa_admin_user }}
  args:
    executable: /bin/bash
  changed_when: false
  no_log: true

- name: Check if Keycloak bind user exists
  ansible.builtin.command: ipa user-show {{ freeipa_bind_uid }}
  register: bind_user_check
  changed_when: false
  failed_when: false

- name: Create Keycloak bind user (fresh-server bootstrap only)
  ansible.builtin.shell: |
    set -o pipefail
    echo "{{ freeipa_bind_password }}" | ipa user-add {{ freeipa_bind_uid }} \
      --first=Keycloak --last=Service --password
  args:
    executable: /bin/bash
  when: bind_user_check.rc != 0
  no_log: true

  # IPA flags initial passwords as "must change on first use". Perform the
  # forced change by kiniting as the new user, answering the password prompts
  # with the same value -> password is now active with no pending prompt,
  # which is what Keycloak needs for simple LDAP bind.
- name: Clear must-change-on-first-login flag for the bind user
  ansible.builtin.shell: |
    set -o pipefail
    printf '%s\n%s\n%s\n' \
      "{{ freeipa_bind_password }}" \
      "{{ freeipa_bind_password }}" \
      "{{ freeipa_bind_password }}" | kinit {{ freeipa_bind_uid }} || true
    kdestroy -q -p {{ freeipa_bind_uid }}@{{ freeipa_realm }} 2>/dev/null || true
  args:
    executable: /bin/bash
  when: bind_user_check.rc != 0
  changed_when: false
  no_log: true

- name: Destroy admin Kerberos ticket
  ansible.builtin.command: kdestroy -A
  changed_when: false

- name: Show bind user status
  ansible.builtin.debug:
    msg: >-
      Bind user {{ freeipa_bind_dn }}:
      {{ 'already exists (skipped)' if bind_user_check.rc == 0 else 'created' }}
