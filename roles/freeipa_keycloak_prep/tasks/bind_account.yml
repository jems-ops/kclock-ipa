---
# ================================
# STIG-Hardened FreeIPA Bind User
# ================================
#
# Assumes:
# - freeipa_admin_user
# - freeipa_admin_password (vault)
# - freeipa_bind_uid
# - freeipa_bind_password (vault)
#
# This implementation is intentionally offline-safe:
# - no ansible.builtin.expect
# - no python3-pexpect dependency
# - no repo / Internet requirement on the IPA host
#
# Passwords are still sourced from vault vars and fed only over stdin to the
# IPA / Kerberos CLIs.

# --------------------------------
# 1. Obtain Kerberos ticket securely
# --------------------------------
- name: Obtain Kerberos ticket
  ansible.builtin.command: kinit {{ freeipa_admin_user }}
  args:
    stdin: "{{ freeipa_admin_password }}"
  no_log: true
  changed_when: false

# --------------------------------
# 2. Check if bind user exists
# --------------------------------
- name: Check if Keycloak bind user exists
  ansible.builtin.command: ipa user-show {{ freeipa_bind_uid }}
  register: bind_user_check
  failed_when: false
  changed_when: false

# --------------------------------
# 3. Create bind user (only if missing)
# --------------------------------
- name: Create Keycloak bind user
  ansible.builtin.command: >
    ipa user-add {{ freeipa_bind_uid }}
    --first=Keycloak
    --last=Service
  when: bind_user_check.rc != 0

# --------------------------------
# 4. Set bind user password securely
# --------------------------------
- name: Set password for bind user
  ansible.builtin.command: ipa passwd {{ freeipa_bind_uid }}
  args:
    stdin: "{{ freeipa_bind_password }}\n{{ freeipa_bind_password }}"
  when: bind_user_check.rc != 0
  no_log: true

# --------------------------------
# 5. Disable password expiration (service account behavior)
# --------------------------------
- name: Ensure bind user password does not expire
  ansible.builtin.command: >
    ipa user-mod {{ freeipa_bind_uid }}
    --setattr=krbPasswordExpiration=20380119031407Z
  register: bind_user_expiration
  changed_when: false
  failed_when:
    - bind_user_expiration.rc != 0
    - "'no modifications to be performed' not in (bind_user_expiration.stderr | lower)"

# --------------------------------
# 6. (Optional but recommended) Ensure user is active
# --------------------------------
- name: Ensure bind user is enabled
  ansible.builtin.command: ipa user-enable {{ freeipa_bind_uid }}
  register: bind_user_enable
  changed_when: false
  failed_when:
    - bind_user_enable.rc != 0
    - "'already enabled' not in (bind_user_enable.stderr | lower)"

# --------------------------------
# 7. Destroy Kerberos tickets
# --------------------------------
- name: Destroy Kerberos ticket cache
  ansible.builtin.command: kdestroy -A
  changed_when: false

# --------------------------------
# 8. Status output
# --------------------------------
- name: Show bind user status
  ansible.builtin.debug:
    msg: >-
      Bind user {{ freeipa_bind_uid }}:
      {{ 'already exists (compliant)' if bind_user_check.rc == 0 else 'created (STIG-compliant)' }}
