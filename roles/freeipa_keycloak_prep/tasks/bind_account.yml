---
- name: Render LDAP bind account update file
  ansible.builtin.template:
    src: keycloak-bind.update.j2
    dest: /root/keycloak-bind.update
    owner: root
    group: root
    mode: "0600"

- name: Create or update Keycloak LDAP bind account via ipa-ldap-updater
  ansible.builtin.command: ipa-ldap-updater /root/keycloak-bind.update
  register: ipa_bind_result
  # ipa-ldap-updater always exits 0 on success; changed when update was applied
  changed_when: "'Update complete' in ipa_bind_result.stdout"
  failed_when: ipa_bind_result.rc != 0

- name: Show bind account result
  ansible.builtin.debug:
    msg: "Bind account uid={{ freeipa_bind_uid }} created/updated: {{ ipa_bind_result.stdout | default('no output') }}"
