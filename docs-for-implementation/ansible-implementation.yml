13) SAML mappers

roles/keycloak_saml_federation/tasks/saml_mappers.yml

- name: Gather SAML client ids
  ansible.builtin.shell: >
    {{ keycloak_kcadm }} get clients -r {{ keycloak_realm }}
    -q clientId='{{ item.client_id }}'
    | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[0]["id"] if d else "")'
  register: saml_client_id_results
  changed_when: false
  loop: "{{ keycloak_saml_clients }}"
  loop_control:
    label: "{{ item.name }}"

- name: Build client id map
  ansible.builtin.set_fact:
    saml_client_ids: "{{ saml_client_ids | default({}) | combine({item.item.name: item.stdout | trim}) }}"
  loop: "{{ saml_client_id_results.results }}"

- name: Render NameID mapper payloads
  ansible.builtin.template:
    src: saml-nameid-mapper.json.j2
    dest: "{{ keycloak_tmp_dir }}/nameid-{{ item.name }}.json"
    mode: "0644"
  loop: "{{ keycloak_saml_clients }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create NameID mappers
  ansible.builtin.command: >
    {{ keycloak_kcadm }} create clients/{{ saml_client_ids[item.name] }}/protocol-mappers/models
    -r {{ keycloak_realm }}
    -f {{ keycloak_tmp_dir }}/nameid-{{ item.name }}.json
  loop: "{{ keycloak_saml_clients }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: false
  changed_when: true

- name: Render user property mappers
  ansible.builtin.template:
    src: saml-user-property-mapper.json.j2
    dest: "{{ keycloak_tmp_dir }}/{{ item.0.name }}-{{ item.1.property }}.json"
    mode: "0644"
  loop: "{{ keycloak_saml_clients | subelements('attributes') }}"
  loop_control:
    label: "{{ item.0.name }} -> {{ item.1.property }}"

- name: Create user property mappers
  ansible.builtin.command: >
    {{ keycloak_kcadm }} create clients/{{ saml_client_ids[item.0.name] }}/protocol-mappers/models
    -r {{ keycloak_realm }}
    -f {{ keycloak_tmp_dir }}/{{ item.0.name }}-{{ item.1.property }}.json
  loop: "{{ keycloak_saml_clients | subelements('attributes') }}"
  loop_control:
    label: "{{ item.0.name }} -> {{ item.1.property }}"
  failed_when: false
  changed_when: true

- name: Render group list mapper payloads
  ansible.builtin.template:
    src: saml-group-mapper.json.j2
    dest: "{{ keycloak_tmp_dir }}/groups-{{ item.name }}.json"
    mode: "0644"
  loop: "{{ keycloak_saml_clients }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create group list mappers
  ansible.builtin.command: >
    {{ keycloak_kcadm }} create clients/{{ saml_client_ids[item.name] }}/protocol-mappers/models
    -r {{ keycloak_realm }}
    -f {{ keycloak_tmp_dir }}/groups-{{ item.name }}.json
  loop: "{{ keycloak_saml_clients }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: false
  changed_when: true

roles/keycloak_saml_federation/templates/saml-nameid-mapper.json.j2

{
  "name": "nameid",
  "protocol": "saml",
  "protocolMapper": "saml-user-attribute-nameid-mapper",
  "config": {
    "user.attribute": "{{ item.nameid_user_attribute }}",
    "saml.nameid.format": "{% if item.nameid_format == 'email' %}urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress{% else %}urn:oasis:names:tc:SAML:2.0:nameid-format:persistent{% endif %}"
  }
}

