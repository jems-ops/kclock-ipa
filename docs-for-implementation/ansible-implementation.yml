10) LDAP provider

Keycloak’s server admin guide documents LDAP storage providers as components under a realm, and shows the components endpoint plus mapper component types such as group-ldap-mapper and full-name-ldap-mapper.  ￼

roles/keycloak_saml_federation/tasks/ldap_provider.yml

- name: Query existing LDAP components in realm
  ansible.builtin.command: >
    {{ keycloak_kcadm }} get components -r {{ keycloak_realm }}
    -q parent={{ keycloak_realm }}
  register: ldap_components_raw
  changed_when: false

- name: Set LDAP provider present flag
  ansible.builtin.set_fact:
    keycloak_ldap_provider_present: "{{ keycloak_ldap_provider_name in ldap_components_raw.stdout }}"

- name: Render LDAP provider payload
  ansible.builtin.template:
    src: ldap-provider.json.j2
    dest: "{{ keycloak_tmp_dir }}/ldap-provider.json"
    mode: "0644"
  when: not keycloak_ldap_provider_present

- name: Create LDAP provider component
  ansible.builtin.command: >
    {{ keycloak_kcadm }} create components -r {{ keycloak_realm }}
    -f {{ keycloak_tmp_dir }}/ldap-provider.json
  when: not keycloak_ldap_provider_present

- name: Query LDAP provider id
  ansible.builtin.shell: >
    {{ keycloak_kcadm }} get components -r {{ keycloak_realm }}
    | python3 -c 'import sys,json;
    data=json.load(sys.stdin);
    matches=[x for x in data if x.get("name")=="{{ keycloak_ldap_provider_name }}"];
    print(matches[0]["id"] if matches else "")'
  register: ldap_provider_id_cmd
  changed_when: false

- name: Save LDAP provider id
  ansible.builtin.set_fact:
    keycloak_ldap_provider_id: "{{ ldap_provider_id_cmd.stdout | trim }}"

- name: Fail if LDAP provider id was not found
  ansible.builtin.fail:
    msg: "LDAP provider {{ keycloak_ldap_provider_name }} not found after creation"
  when: keycloak_ldap_provider_id | length == 0

roles/keycloak_saml_federation/templates/ldap-provider.json.j2

{
  "name": "{{ keycloak_ldap_provider_name }}",
  "providerId": "ldap",
  "providerType": "org.keycloak.storage.UserStorageProvider",
  "parentId": "{{ keycloak_realm }}",
  "config": {
    "enabled": ["true"],
    "priority": ["0"],
    "fullSyncPeriod": ["-1"],
    "changedSyncPeriod": ["-1"],
    "cachePolicy": ["DEFAULT"],
    "batchSizeForSync": ["1000"],
    "editMode": ["READ_ONLY"],
    "importEnabled": ["true"],
    "syncRegistrations": ["false"],
    "vendor": ["other"],
    "usernameLDAPAttribute": ["{{ keycloak_ldap_username_attr }}"],
    "rdnLDAPAttribute": ["{{ keycloak_ldap_rdn_attr }}"],
    "uuidLDAPAttribute": ["{{ keycloak_ldap_uuid_attr }}"],
    "userObjectClasses": ["{{ keycloak_ldap_user_object_classes | join(',') }}"],
    "connectionUrl": ["{{ freeipa_ldap_url }}"],
    "usersDn": ["{{ freeipa_users_dn }}"],
    "authType": ["simple"],
    "bindDn": ["{{ freeipa_bind_dn }}"],
    "bindCredential": ["{{ keycloak_ldap_bind_password }}"],
    "searchScope": ["2"],
    "validatePasswordPolicy": ["false"],
    "trustEmail": ["true"],
    "useKerberosForPasswordAuthentication": ["false"],
    "pagination": ["true"]
  }
}


