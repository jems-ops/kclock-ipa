5) FreeIPA role

roles/freeipa_keycloak_prep/defaults/main.yml

freeipa_bind_password: "{{ vault_freeipa_bind_password }}"
freeipa_ca_cert_path: /etc/ipa/ca.crt
freeipa_keycloak_ca_export_path: /tmp/freeipa-ca.crt

roles/freeipa_keycloak_prep/tasks/main.yml

- import_tasks: bind_account.yml
- import_tasks: export_ca.yml
- import_tasks: validate.yml

roles/freeipa_keycloak_prep/tasks/bind_account.yml

- name: Create FreeIPA bind update file
  ansible.builtin.template:
    src: keycloak-bind.update.j2
    dest: /root/keycloak-bind.update
    owner: root
    group: root
    mode: "0600"

- name: Create or update FreeIPA bind account
  ansible.builtin.command: ipa-ldap-updater /root/keycloak-bind.update
  register: ipa_bind_create
  changed_when: "'Update complete' in ipa_bind_create.stdout or ipa_bind_create.rc == 0"

roles/freeipa_keycloak_prep/tasks/export_ca.yml

- name: Ensure FreeIPA CA cert exists
  ansible.builtin.stat:
    path: "{{ freeipa_ca_cert_path }}"
  register: ipa_ca_stat

- name: Copy FreeIPA CA cert to temporary export path
  ansible.builtin.copy:
    src: "{{ freeipa_ca_cert_path }}"
    dest: "{{ freeipa_keycloak_ca_export_path }}"
    remote_src: true
    mode: "0644"
  when: ipa_ca_stat.stat.exists

roles/freeipa_keycloak_prep/tasks/validate.yml

- name: Validate LDAP bind account can search users
  ansible.builtin.shell: >
    ldapsearch -x
    -D "{{ freeipa_bind_dn }}"
    -w "{{ freeipa_bind_password }}"
    -b "{{ freeipa_users_dn }}"
    "(uid=admin)"
  register: ldap_bind_validation
  changed_when: false
  failed_when: ldap_bind_validation.rc != 0

- name: Show bind validation summary
  ansible.builtin.debug:
    msg:
      - "FreeIPA bind DN: {{ freeipa_bind_dn }}"
      - "LDAP bind validation succeeded"

roles/freeipa_keycloak_prep/templates/keycloak-bind.update.j2

dn: uid={{ freeipa_bind_uid }},cn=sysaccounts,cn=etc,{{ freeipa_base_dn }}
default:objectClass: account
default:objectClass: simpleSecurityObject
default:uid: {{ freeipa_bind_uid }}
only:userPassword: {{ freeipa_bind_password }}
only:passwordExpirationTime: 20380119031407Z
only:nsIdleTimeout: 0

That bind-account pattern follows FreeIPA’s documented method for creating a dedicated LDAP bind DN under cn=sysaccounts,cn=etc,... and loading it with ipa-ldap-updater.  ￼

