8) Authenticate to Keycloak

roles/keycloak_saml_federation/tasks/auth.yml

- name: Authenticate kcadm against Keycloak admin realm
  ansible.builtin.command: >
    {{ keycloak_kcadm }} config credentials
    --server {{ keycloak_base_url }}
    --realm {{ keycloak_admin_realm }}
    --user {{ keycloak_admin_user }}
    --password {{ keycloak_admin_password }}
  register: kcadm_auth
  changed_when: false


