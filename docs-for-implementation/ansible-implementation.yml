11) LDAP mappers

Keycloak documents dedicated LDAP mapper types including full-name-ldap-mapper and group-ldap-mapper, with configuration keys like groups.dn, group.name.ldap.attribute, group.object.classes, membership.ldap.attribute, and membership.attribute.type.  ￼

roles/keycloak_saml_federation/tasks/ldap_mappers.yml

- name: Render username mapper payload
  ansible.builtin.template:
    src: user-attribute-mapper.json.j2
    dest: "{{ keycloak_tmp_dir }}/mapper-username.json"
    mode: "0644"
