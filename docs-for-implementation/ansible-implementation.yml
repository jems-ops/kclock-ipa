14) Sync and validation

roles/keycloak_saml_federation/tasks/sync.yml

- name: Trigger full user sync
  ansible.builtin.command: >
    {{ keycloak_kcadm }} create user-storage/{{ keycloak_ldap_provider_id }}/sync?action=triggerFullSync
    -r {{ keycloak_realm }}
  register: full_sync_result
  changed_when: true
  failed_when: false

- name: Show sync result
  ansible.builtin.debug:
    var: full_sync_result.stdout

roles/keycloak_saml_federation/tasks/validate.yml

- name: Validate realm exists
  ansible.builtin.command: >
    {{ keycloak_kcadm }} get realms/{{ keycloak_realm }}
  register: validate_realm
  changed_when: false

- name: Validate LDAP provider exists
  ansible.builtin.command: >
    {{ keycloak_kcadm }} get components/{{ keycloak_ldap_provider_id }} -r {{ keycloak_realm }}
  register: validate_ldap_provider
  changed_when: false

- name: Display Keycloak SAML IdP metadata URL
  ansible.builtin.debug:
    msg: "{{ keycloak_base_url }}/realms/{{ keycloak_realm }}/protocol/saml/descriptor"

- name: List realm users
  ansible.builtin.command: >
    {{ keycloak_kcadm }} get users -r {{ keycloak_realm }} --fields username,email,firstName,lastName
  register: validate_users
  changed_when: false

- name: Show imported users
  ansible.builtin.debug:
    var: validate_users.stdout


