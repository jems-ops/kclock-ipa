15) Direct kcadm.sh command examples

These are the same operations in raw command form.

Login

/opt/keycloak/bin/kcadm.sh config credentials \
  --server https://server2.example.com \
  --realm master \
  --user admin \
  --password 'SuperSecretAdminPassword'

Create realm

/opt/keycloak/bin/kcadm.sh create realms \
  -s realm=corp \
  -s enabled=true

Create LDAP provider

/opt/keycloak/bin/kcadm.sh create components -r corp \
  -s name=freeipa-ldap \
  -s providerId=ldap \
  -s providerType=org.keycloak.storage.UserStorageProvider \
  -s parentId=corp \
  -s 'config.enabled=["true"]' \
  -s 'config.priority=["0"]' \
  -s 'config.editMode=["READ_ONLY"]' \
  -s 'config.importEnabled=["true"]' \
  -s 'config.syncRegistrations=["false"]' \
  -s 'config.vendor=["other"]' \
  -s 'config.connectionUrl=["ldaps://server1.example.com:636"]' \
  -s 'config.usersDn=["cn=users,cn=accounts,dc=example,dc=com"]' \
  -s 'config.usernameLDAPAttribute=["uid"]' \
  -s 'config.rdnLDAPAttribute=["uid"]' \
  -s 'config.uuidLDAPAttribute=["ipaUniqueID"]' \
  -s 'config.userObjectClasses=["top,person,organizationalPerson,inetOrgPerson"]' \
  -s 'config.authType=["simple"]' \
  -s 'config.bindDn=["uid=keycloak-bind,cn=sysaccounts,cn=etc,dc=example,dc=com"]' \
  -s 'config.bindCredential=["SuperSecretBindPassword"]' \
  -s 'config.searchScope=["2"]' \
  -s 'config.pagination=["true"]'

Create full-name LDAP mapper

/opt/keycloak/bin/kcadm.sh create components -r corp \
  -s name=full-name \
  -s providerId=full-name-ldap-mapper \
  -s providerType=org.keycloak.storage.ldap.mappers.LDAPStorageMapper \
  -s parentId=<LDAP_PROVIDER_ID> \
  -s 'config."ldap.full.name.attribute"=["cn"]' \
  -s 'config."read.only"=["true"]' \
  -s 'config."write.only"=["false"]'

Create group LDAP mapper

The Keycloak admin guide shows this mapper type and its key config fields under the components endpoint.  ￼

/opt/keycloak/bin/kcadm.sh create components -r corp \
  -s name=freeipa-groups \
  -s providerId=group-ldap-mapper \
  -s providerType=org.keycloak.storage.ldap.mappers.LDAPStorageMapper \
  -s parentId=<LDAP_PROVIDER_ID> \
  -s 'config."groups.dn"=["cn=groups,cn=accounts,dc=example,dc=com"]' \
  -s 'config."group.name.ldap.attribute"=["cn"]' \
  -s 'config."group.object.classes"=["groupOfNames"]' \
  -s 'config."membership.ldap.attribute"=["member"]' \
  -s 'config."membership.attribute.type"=["DN"]' \
  -s 'config.mode=["LDAP_ONLY"]' \
  -s 'config."user.roles.retrieve.strategy"=["LOAD_GROUPS_BY_MEMBER_ATTRIBUTE"]' \
  -s 'config."preserve.group.inheritance"=["true"]'

Create SAML client

/opt/keycloak/bin/kcadm.sh create clients -r corp \
  -s clientId='https://app1.example.com/saml' \
  -s name='app1-saml' \
  -s enabled=true \
  -s protocol=saml \
  -s baseUrl='https://app1.example.com' \
  -s 'redirectUris=["https://app1.example.com/*"]' \
  -s 'attributes."saml.assertion.signature"="true"' \
  -s 'attributes."saml.server.signature"="true"' \
  -s 'attributes."saml.force.post.binding"="true"' \
  -s 'attributes."saml.authnstatement"="true"' \
  -s 'attributes."saml_assertion_consumer_url_post"="https://app1.example.com/saml/acs"'

Keycloak IdP metadata URL

https://server2.example.com/realms/corp/protocol/saml/descriptor

That realm SAML descriptor path is how Keycloak exposes SAML metadata for integration.  ￼

⸻

16) What to improve next

The skeleton above works as a starting point, but for production I would add:
	•	idempotent checks before creating mappers and clients
	•	CA import into Keycloak truststore
	•	service restart handler after truststore changes
	•	better JSON parsing with community.general.json_query
	•	optional Kerberos auth later
	•	client metadata import when SP metadata XML is available
	•	secret handling only through vault, never plain vars

⸻

17) Recommended rollout order

Run in this order:

ansible-playbook -i inventory/hosts.yml playbooks/freeipa_prep.yml --ask-vault-pass
ansible-playbook -i inventory/hosts.yml playbooks/keycloak_config.yml --ask-vault-pass

Then test:
	1.	log into Keycloak realm with a FreeIPA user
	2.	verify users and groups appear in Keycloak
	3.	open the pilot SAML app
	4.	confirm SAML assertion includes email, username, firstName, lastName, groups

⸻

18) Practical note

Some exact SAML client attributes can vary slightly across Keycloak versions and app requirements, but the overall structure here is aligned with current Keycloak admin guidance for LDAP storage, LDAP mappers, and SAML application integration.  ￼

