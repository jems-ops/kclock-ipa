Below is a full Ansible role skeleton for FreeIPA + Keycloak where:
	•	FreeIPA is the identity source
	•	Keycloak is the SAML IdP
	•	SAML apps trust Keycloak
	•	Keycloak federates users/groups from FreeIPA over LDAP

This approach matches Keycloak’s LDAP federation and SAML client model, and FreeIPA’s documented pattern for creating a dedicated LDAP bind account under cn=sysaccounts,cn=etc,....  ￼

Servers are defined in the inventory as follows:

[freeipa]
freeipa.local ansible_host=192.168.56.14

[keycloak]
keycloak.local ansible_host=192.168.201.12

[sonarqube]
sonar.local ansible_host=192.168.201.16

[nginx]
nginx-proxy ansible_host=192.168.201.15
