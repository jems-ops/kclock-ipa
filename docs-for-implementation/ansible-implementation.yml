12) SAML clients

Keycloak supports SAML clients and publishes realm-level SAML descriptor metadata that service providers can use when integrating against Keycloak as an IdP.  ￼

roles/keycloak_saml_federation/tasks/saml_clients.yml

- name: Render SAML client payloads
  ansible.builtin.template:
    src: saml-client.json.j2
    dest: "{{ keycloak_tmp_dir }}/client-{{ item.name }}.json"
    mode: "0644"
  loop: "{{ keycloak_saml_clients }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create SAML clients
  ansible.builtin.command: >
    {{ keycloak_kcadm }} create clients -r {{ keycloak_realm }}
    -f {{ keycloak_tmp_dir }}/client-{{ item.name }}.json
  loop: "{{ keycloak_saml_clients }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: false
  changed_when: true

roles/keycloak_saml_federation/templates/saml-client.json.j2

{
  "clientId": "{{ item.client_id }}",
  "name": "{{ item.name }}",
  "enabled": true,
  "protocol": "saml",
  "baseUrl": "{{ item.base_url }}",
  "adminUrl": "{{ item.admin_url }}",
  "redirectUris": {{ item.redirect_uris | to_json }},
  "attributes": {
    "saml.assertion.signature": "{{ item.sign_assertions }}",
    "saml.server.signature": "{{ item.sign_documents }}",
    "saml.force.post.binding": "{{ item.force_post_binding }}",
    "saml.authnstatement": "{{ item.include_authnstatement }}",
    "saml_name_id_format": "{{ item.nameid_format }}",
    "saml_single_logout_service_url_post": "",
    "saml_assertion_consumer_url_post": "{{ item.acs_url }}"
  }
}


