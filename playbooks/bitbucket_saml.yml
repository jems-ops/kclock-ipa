---
# Configures Bitbucket Data Center SAML authentication via the Atlassian REST API.
# Uses the shared atlassian_saml_config role with atlassian_product set to bitbucket.
#
# Prerequisite: run keycloak_config.yml first so the Bitbucket SAML client and
# realm exist in Keycloak.

- name: Configure Bitbucket SAML settings
  hosts: bitbucket
  become: false
  gather_facts: false
  roles:
    - role: atlassian_saml_config
      vars:
        atlassian_product: bitbucket
