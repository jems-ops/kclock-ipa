---
# Configures Jira Data Center SAML authentication via the Atlassian REST API.
# Uses the shared atlassian_saml_config role with atlassian_product set to jira.
#
# Prerequisite: run keycloak_config.yml first so the Jira SAML client and
# realm exist in Keycloak.

- name: Configure Jira SAML settings
  hosts: jira
  become: false
  gather_facts: false
  roles:
    - role: atlassian_saml_config
      vars:
        atlassian_product: jira
