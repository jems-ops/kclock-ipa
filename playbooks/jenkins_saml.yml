---
# Configures Jenkins SAML authentication by rendering config.xml from a Jinja
# template and restarting Jenkins. Mirrors playbooks/sonarqube_saml.yml.
#
# Prerequisite: run keycloak_config.yml first so the Jenkins SAML client and
# realm exist in Keycloak.

- name: Configure Jenkins SAML settings
  hosts: jenkins
  become: true
  gather_facts: false
  roles:
    - jenkins_saml_config
